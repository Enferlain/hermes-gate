[project]
name = "hermes-gate"
version = "0.1.0"
description = "Local authorization and approval layer for Hermes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4,<5",
    "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
hermes-gate = "hermes_gate.cli:main"
hermes-gated = "hermes_gate.service.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.12,<1",
    "ty>=0.0.17,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_gate"]

[tool.pytest.ini_options]
addopts = "-q -ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "TID252", "RUF", "ASYNC"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.13"